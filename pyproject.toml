[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "su-multi-arm"
version = "2.0.0a1"
description = "Configurable, provenance-aware multi-arm retrieval and grounded answers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "su_multi_arm contributors"}]
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6,<7", "numpy>=1.26,<3", "httpx>=0.27,<1", "snowballstemmer>=2.2,<4"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Text Processing :: Indexing"]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
postgres = ["psycopg[binary]>=3.2,<4"]
sql = ["sqlalchemy>=2.0,<3"]
neo4j = ["neo4j>=5.24,<7"]
elasticsearch = ["elasticsearch>=8.17,<9"]
mongodb = ["pymongo>=4.6,<5"]
opensearch = ["opensearch-py>=2.8,<4"]
semantic = ["sentence-transformers>=3.0"]
local = ["sentence-transformers>=3.0"]  # local embedder/reranker models (alias of semantic)
spacy = ["spacy>=3.8"]
gliner = ["gliner>=0.2"]
communities = ["networkx>=3.3"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.10,<2"]
# The OpenAI and Anthropic providers speak the HTTP APIs through httpx (a core dependency); these
# extras are intentionally empty so `pip install su-multi-arm[openai]` / `[anthropic]` resolve.
openai = []
anthropic = []
all = ["su-multi-arm[faiss,postgres,sql,neo4j,elasticsearch,mongodb,opensearch,semantic,spacy,gliner,communities,api,mcp]"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "hatchling>=1.25"]

[project.scripts]
su-multi-arm = "su_multi_arm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/su_multi_arm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: isolated external database integration tests"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
