# Synthetic live-shape fixture (unified merge plan F0): invented values; materialize() fills the sha256 placeholders.
schema_version: 2
dataset: support_fixture
profile: neutral
backends:
  local:
    kind: sqlite
    path: state
    lexical_engine: bm25
    bm25:
      tokenizer: ascii_alnum
    vector_engine: faiss
  kz:
    kind: kuzu
    path: graph.kuzu
    mode: attach
    attach:
      mapping: kuzu_mapping.yaml
storage:
  catalog: local
  records: local
  ledger: local
  sessions: local
  cache: local
  communities: local
metadata_schema:
  canonical_unit: ticket
  fields:
  - name: source
    type: enum
    enum_values:
    - ticket
    - doc
    listable: true
    groupable: true
    description: 'Record source: a support ticket or a documentation page.'
  - name: account
    type: string
    listable: true
    groupable: true
    description: Customer account name as entered on the ticket (raw text).
  - name: product
    type: string
    listable: true
    groupable: true
    description: Product area of the record.
  - name: service
    type: string
    listable: true
    groupable: true
    description: Service family the record concerns.
  - name: status
    type: string
    listable: true
    groupable: true
    description: Ticket status at snapshot time.
  - name: priority
    type: string
    listable: true
    groupable: true
    description: Ticket priority.
  - name: created_at
    type: datetime
    sortable: true
    time_basis: created
    description: When the ticket was opened (UTC).
  - name: resolved_at
    type: datetime
    sortable: true
    time_basis: resolved
    description: When the ticket was solved (UTC); null while open.
  - name: updated_at
    type: datetime
    sortable: true
    time_basis: updated
    description: Last update of a documentation page (UTC).
  - name: ticket_number
    type: id
    pattern: ticket:[0-9]{3,6}
    description: Ticket identifier.
  - name: kg_request_type
    type: string
    listable: true
    groupable: true
    description: Request type assigned by the offline ticket analysis.
  - name: kg_outcome
    type: string
    listable: true
    groupable: true
    description: Outcome assigned by the offline ticket analysis.
  - name: kg_is_resolved
    type: boolean
    description: Whether the offline analysis judged the ticket resolved.
  - name: kg_severity
    type: string
    listable: true
    groupable: true
    description: Severity assigned by the offline ticket analysis.
  - name: sla_breached
    type: boolean
    description: Whether the response target was missed.
projection:
  enabled: true
  backend: local
  tables:
    ticket:
      kind: ticket
      description: One row per support ticket.
      columns:
      - source
      - account
      - product
      - service
      - status
      - priority
      - created_at
      - resolved_at
      - kg_request_type
      - kg_outcome
      - kg_is_resolved
      - kg_severity
      - sla_breached
      text_columns:
        subject:
          source: title
          description: Ticket subject line (free text).
        description:
          source: fields.description
          description: Ticket description (free text).
ingestion:
  chunking:
    size: 1600
    overlap: 160
  attach:
  - path: '@path:ticket_insights.sqlite@'
    sha256: '@sha256:ticket_insights.sqlite@'
    table: ticket_insights
    key_column: ticket_id
    document_id: ticket:{key}
    columns:
      request_type: kg_request_type
      outcome: kg_outcome
      is_resolved: kg_is_resolved
      severity: kg_severity
  - path: '@path:ticket_insights.sqlite@'
    sha256: '@sha256:ticket_insights.sqlite@'
    table: ticket_sla
    key_column: ticket_id
    document_id: ticket:{key}
    columns:
      breached: sla_breached
extraction:
  extractors: []
communities:
  strategy: imported
  imported:
    path: '@path:communities.jsonl@'
    sha256: '@sha256:communities.jsonl@'
    on_ungrounded: drop_claim
    extractive_sentences: 3
request:
  context_keys:
  - subject
  - description
  - account
  - product
  pipelines:
  - agentic
  evidence_chars_max: 120000
models:
  roles:
    planner:
      provider: anthropic
      model: claude-sonnet-5-5
      api_key_env: SU_FIXTURE_API_KEY
      max_tokens: 1500
      timeout_seconds: 90
      thinking: 'off'
    query_writer:
      provider: anthropic
      model: claude-sonnet-5-5
      api_key_env: SU_FIXTURE_API_KEY
      max_tokens: 3000
      timeout_seconds: 90
      thinking: 'off'
    reviewer:
      provider: anthropic
      model: claude-sonnet-5-5
      api_key_env: SU_FIXTURE_API_KEY
      max_tokens: 1500
      timeout_seconds: 90
      thinking: 'off'
      capabilities:
        structured_output: none
    generator:
      provider: anthropic
      model: claude-haiku-4-5
      api_key_env: SU_FIXTURE_API_KEY
      max_tokens: 2600
      timeout_seconds: 120
      thinking: 'off'
      measure_first_token: true
      capabilities:
        streaming: true
      evidence_budget:
        chars: 40000
    embedder:
      provider: sentence_transformers
      model: BAAI/bge-m3
      dimensions: 1024
      device: cpu
      batch_size: 32
      precomputed:
        vectors: vectors.npy
        keys: precomputed_keys.jsonl
        sha256: '@sha256:vectors.npy@'
        keys_sha256: '@sha256:precomputed_keys.jsonl@'
        verify:
          sample: 0
pipeline:
  decision:
    kind: llm
    prompt_file: planner_prompt.md
    max_steps: 6
    on_step_failure: partial
    arm_cards: true
    typed_query:
      enabled: true
      repair_attempts: 0
      routing: router
      router_role: query_writer
  generation:
    contract:
      on_violation: annotate
  arms:
    exact_id:
      alias_fields:
      - ticket_number
    dense:
      backend: local
      candidates: 400
    lexical:
      backend: local
      candidates: 400
    structured:
      backend: local
    typed_query:
      mode: sql_surface
      row_limit: 200
      text_backend: local
      sql_surface:
        role: query_writer
        repair_attempts: 1
        list_values_up_to: 64
    segment:
      path: '@path:segments@'
      candidates: 40
      lexical: true
      max_segments_per_parent: 3
    community:
      backend: local
      claim_hits: true
    graph:
      backend: kz
      hops: 1
      path_evidence: true
  selection:
    collapse: document
    per_arm: 20
    ordering: reciprocal_rank
    arm_weights:
      graph: 0.25
      segment: 0.25
      community: 0.25
    source_weights:
      doc: 1.5
    rerank: false
    packing:
      metadata_fields:
      - source
      - account
      - product
      - service
      - status
      - priority
      - created_at
      - resolved_at
      - kg_outcome
      metadata_show_null:
      - resolved_at
      metadata_protected:
      - source
      - status
      - created_at
      metadata_max_share: 0.25
pipelines:
  agentic:
    review:
      enabled: true
      max_hops: 2
serving:
  answers:
    enabled: true
    max_usd_per_day: 3.0
    ledger: state/answers_spend.sqlite
budgets:
  max_llm_calls: 7
  max_usd: 0.25
  deadline_seconds: 240
  price_table: prices.yaml
