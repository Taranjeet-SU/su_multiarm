name: package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,api,mcp,faiss,communities,sql,postgres,openai,anthropic]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - run: su-multi-arm --config examples/local.yaml ingest examples/documents.jsonl
      - run: su-multi-arm --config examples/local.yaml evaluate examples/evaluation.json
