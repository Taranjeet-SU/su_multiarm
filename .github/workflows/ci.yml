name: package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,api,mcp,faiss,communities,sql,postgres,openai,anthropic]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - run: su-multi-arm --config examples/local.yaml ingest examples/documents.jsonl
      - run: su-multi-arm --config examples/local.yaml evaluate examples/evaluation.json
  ui:
    # The web UI (ui/): optional for the Python jobs above, which never need Node.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: python -m pip install build && python -m build python
  ui-e2e:
    # Browser smoke against a synthetic logs engine with the loopback fake streaming model: token
    # entry, streamed answer, citations, evidence/graph/trace tabs, chart, graph explorer; fails on any
    # CSP violation or page error. Isolated temporary workspace; no network services, no paid calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e '.[dev,api,patterns-lite]'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: ui
      - name: serve the synthetic engine
        run: |
          PYTHONPATH=src:tests python ui/e2e/serve_synthetic.py --workdir "$RUNNER_TEMP/ui-smoke" --port 18099 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18099/ui/ >/dev/null && break; sleep 1; done
      - run: node e2e/smoke.mjs http://127.0.0.1:18099/ui/ smoke-token "$RUNNER_TEMP/ui-shots"
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-shots
