schema_version: 1
dataset: demo
storage_path: ./state
embedding:
  provider: hash
  dimensions: 256
extraction:
  providers: [tags, regex]
  tags:
    topic: [exemption certificate, rounding, content source]
    product: [CloudTax, SearchDesk]
    state: [California, Texas]
  patterns:
    error: '\bERR-[0-9]+\b'
arms:
  enabled: [dense, lexical, sql, graph, community]
  dense: numpy
  lexical: sqlite
  graph: sqlite
  per_arm: 20
fusion:
  strategy: per_arm
  source_weights: {article: 1.2, manual: 1.1, case: 1.0, tracker: 0.9}
routing:
  mode: raw
community:
  strategy: entity
  min_documents: 2
